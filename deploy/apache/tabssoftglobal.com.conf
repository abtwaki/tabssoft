# HTTP vhost — redirects to HTTPS once the cert exists.
# Until DNS resolves and certbot runs, this serves the site on :80 too.
<VirtualHost *:80>
    ServerName tabssoftglobal.com
    ServerAlias www.tabssoftglobal.com

    # ACME challenges served locally for Let's Encrypt
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # --- React production build ---
    DocumentRoot /var/www/tabssoft-website/frontend/build
    <Directory /var/www/tabssoft-website/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Django static & media
    Alias /static/ /var/www/tabssoft-website/backend/staticfiles/
    <Directory /var/www/tabssoft-website/backend/staticfiles/>
        Require all granted
    </Directory>
    Alias /media/ /var/www/tabssoft-website/backend/media/
    <Directory /var/www/tabssoft-website/backend/media/>
        Require all granted
    </Directory>

    # API + Django admin proxied to gunicorn on 127.0.0.1:8003
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8003/api/
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/
    ProxyPass /admin/ http://127.0.0.1:8003/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8003/admin/

    # index.html always revalidates; hashed /assets are immutable
    <Location "/">
        Header set Cache-Control "no-cache"
    </Location>
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/tabssoft-error.log
    CustomLog ${APACHE_LOG_DIR}/tabssoft-access.log combined
</VirtualHost>

# After DNS points here, run:
#   certbot --apache -d tabssoftglobal.com -d www.tabssoftglobal.com
# Certbot will create the :443 vhost; then uncomment the redirect below and
# remove the DocumentRoot/proxy block above from :80.
#
# RewriteEngine on
# RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
# RewriteRule ^/?(.*)$ https://tabssoftglobal.com/$1 [R=301,L]
